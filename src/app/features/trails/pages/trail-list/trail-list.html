<div class="trail-list-container">
    <h2>Trail List</h2>
    
    @let s = state();
  @if (s.status === 'loading') {
    <p>Loading trails...</p>
  } @else if (s.status === 'error') {
    <p> {{ s.message }}</p>
  } @else if (s.data.length === 0) {
    <p>No trails available at the moment.</p>
  } @else {
    <div class="grid">
      @for (trail of s.data; track trail._id) {
        <app-trail-card [trail]="trail" />
      }
    </div>
  }

</div>
